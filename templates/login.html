{% extends "base.html" %}
{% block title %}Log in · NoteSpace{% endblock %}
{% block main_class %}auth-shell{% endblock %}
{% block content %}
<section class="auth-card">
    <div class="eyebrow"><span class="eyebrow-dot"></span> WELCOME BACK</div>
    <h1>Good to see you.</h1>
    <p class="auth-intro">Log in to pick up where your thoughts left off.</p>
    <form id="login-form" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="next" value="{{ next_url }}">
        <div class="form-field">
            <label for="loginEmail">Email address</label>
            <input class="form-control" type="email" id="loginEmail" name="email" autocomplete="email" placeholder="you@example.com" required>
        </div>
        <div class="form-field">
            <label for="loginPassword">Password</label>
            <div class="password-input-wrap">
                <input class="form-control" type="password" id="loginPassword" name="password" autocomplete="current-password" placeholder="Enter your password" required>
                <button class="password-toggle" type="button" aria-controls="loginPassword" aria-label="Show password" aria-pressed="false">
                    <svg class="password-eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>
                    <svg class="password-eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 6.2A10.7 10.7 0 0 1 12 6c6.1 0 9.5 6 9.5 6a16 16 0 0 1-3.1 3.6M6.2 6.3C3.8 7.8 2.5 12 2.5 12s3.4 6 9.5 6c1 0 1.9-.2 2.7-.5"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
                </button>
            </div>
        </div>
        <button class="primary-button auth-submit" type="submit">Log in</button>
    </form>
    <p class="auth-switch">New to NoteSpace? <a href="{{ url_for('auth.signup') }}">Create an account</a></p>
</section>
{% endblock %}
